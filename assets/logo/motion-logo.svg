<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a10"/>
      <stop offset="0.55" stop-color="#12233d"/>
      <stop offset="1" stop-color="#1e3a5e"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#FF2E88"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="none" stroke="#00E5FF" stroke-opacity="0.35" stroke-width="4"/>
  <!-- motion speed lines -->
  <g stroke-linecap="round">
    <line x1="40" y1="96" x2="76" y2="96" stroke="#00E5FF" stroke-width="10"/>
    <line x1="30" y1="128" x2="66" y2="128" stroke="#FF2E88" stroke-width="10"/>
    <line x1="40" y1="160" x2="76" y2="160" stroke="#FFE600" stroke-width="10"/>
  </g>
  <!-- play triangle -->
  <path d="M108 74 L188 128 L108 182 Z" fill="#FFFFFF"/>
  <!-- light-sweep slash across the triangle -->
  <path d="M142 74 L166 74 L126 182 L102 182 Z" fill="url(#sweep)" fill-opacity="0.85"/>
</svg>
